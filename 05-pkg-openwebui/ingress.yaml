# ==============================================================================
# Manifest: ingress.yaml
# Namespace: openwebui
# Description: Ingress resource routing web traffic to Open WebUI service.
# ==============================================================================

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: open-webui-ingress
  namespace: openwebui
  labels:
    app.kubernetes.io/name: open-webui
    app.kubernetes.io/part-of: ai-portal
  annotations:
    kubernetes.io/ingress.class: "gitlab-nginx"
    nginx.ingress.kubernetes.io/proxy-body-size: "100m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "600"
spec:
  ingressClassName: gitlab-nginx
  rules:
    - host: openwebui.internal.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: open-webui
                port:
                  number: 8080
