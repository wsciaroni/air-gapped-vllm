# ==============================================================================
# Manifest: deployment.yaml
# Spoke: Nomic Embed Text v1.5 (Text Embeddings Inference)
# Infrastructure: 2 Replicas, GPU accelerated embedding engine
# Purpose: High-speed vector embeddings for GitLab Duo Code Search and Context
# ==============================================================================

apiVersion: apps/v1
kind: Deployment
metadata:
  name: tei-embed-deployment
  namespace: inference
  labels:
    app: tei-embed-inference
    app.kubernetes.io/name: tei-embed-service
    app.kubernetes.io/component: embedding-spoke
    app.kubernetes.io/part-of: ai-inference-stack
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app: tei-embed-inference
  template:
    metadata:
      labels:
        app: tei-embed-inference
        app.kubernetes.io/name: tei-embed-service
    spec:
      nodeSelector:
        vSphere.vm.class: "best-effort-gpu"

      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - tei-embed-inference
                topologyKey: "kubernetes.io/hostname"

      containers:
        - name: tei-embed
          image: local-registry/tei-nomic-embed:v1
          imagePullPolicy: IfNotPresent
          args:
            - "--model-id"
            - "/models/nomic-embed-text"
            - "--port"
            - "8000"
            - "--hostname"
            - "0.0.0.0"
            - "--max-client-batch-size"
            - "64"
            - "--max-batch-tokens"
            - "32768"
          ports:
            - name: http-embed
              containerPort: 8000
              protocol: TCP
          resources:
            requests:
              cpu: "4"
              memory: "8Gi"
              nvidia.com/gpu: "1"
            limits:
              cpu: "8"
              memory: "16Gi"
              nvidia.com/gpu: "1"
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 5

---
apiVersion: v1
kind: Service
metadata:
  name: tei-embed-service
  namespace: inference
  labels:
    app: tei-embed-inference
    app.kubernetes.io/name: tei-embed-service
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8000
      targetPort: 8000
      protocol: TCP
  selector:
    app: tei-embed-inference
