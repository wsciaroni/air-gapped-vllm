# ==============================================================================
# Manifest: deployment.yaml
# Spoke: GPT OSS 120B (FP8 Quantized MoE)
# Infrastructure: 2 Replicas, TP=2 (4 GPUs total across 2 nodes), L40 GPUs
# Features: FP8 Quantization, llama3_json tool parser for Duo agent reasoning
# ==============================================================================

apiVersion: apps/v1
kind: Deployment
metadata:
  name: gpt-oss-deployment
  namespace: inference
  labels:
    app: gpt-oss-inference
    app.kubernetes.io/name: gpt-oss-service
    app.kubernetes.io/component: llm-spoke
    app.kubernetes.io/part-of: ai-inference-stack
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app: gpt-oss-inference
  template:
    metadata:
      labels:
        app: gpt-oss-inference
        app.kubernetes.io/name: gpt-oss-service
    spec:
      # Tanzu GPU VM Class mapping 2x L40 GPUs per worker node
      nodeSelector:
        vSphere.vm.class: "best-effort-gpu"

      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - gpt-oss-inference
                topologyKey: "kubernetes.io/hostname"

      containers:
        - name: vllm-gpt-oss
          image: local-registry/vllm-gpt-oss:v1
          imagePullPolicy: IfNotPresent
          args:
            - "--model"
            - "/models/gpt-oss-120b"
            - "--served-model-name"
            - "gpt-oss-120b"
            - "--tensor-parallel-size"
            - "2"
            - "--quantization"
            - "fp8"
            - "--enable-auto-tool-choice"
            - "--tool-call-parser"
            - "llama3_json"
            - "--gpu-memory-utilization"
            - "0.95"
            - "--max-model-len"
            - "65536"
            - "--port"
            - "8000"
            - "--host"
            - "0.0.0.0"
            - "--disable-log-requests"
          env:
            - name: NCCL_DEBUG
              value: "WARN"
            - name: VLLM_NO_USAGE_STATS
              value: "1"
          ports:
            - name: http-inference
              containerPort: 8000
              protocol: TCP
          resources:
            requests:
              cpu: "12"
              memory: "64Gi"
              nvidia.com/gpu: "2"
            limits:
              cpu: "24"
              memory: "128Gi"
              nvidia.com/gpu: "2"
          volumeMounts:
            # 16Gi RAM-backed emptyDir mounted to /dev/shm for tensor parallelism IPC
            - name: dshm
              mountPath: /dev/shm
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 180
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 90
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 2
      volumes:
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 16Gi

---
apiVersion: v1
kind: Service
metadata:
  name: gpt-oss-service
  namespace: inference
  labels:
    app: gpt-oss-inference
    app.kubernetes.io/name: gpt-oss-service
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8000
      targetPort: 8000
      protocol: TCP
  selector:
    app: gpt-oss-inference
