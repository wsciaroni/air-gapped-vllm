# ==============================================================================
# Manifest: pdb.yaml
# Spoke: Laguna XS 2.1
# Policy: Ensures at least 1 replica is active during Tanzu node maintenance
# ==============================================================================

apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: laguna-pdb
  namespace: inference
  labels:
    app: laguna-inference
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: laguna-inference
