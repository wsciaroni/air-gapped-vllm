# ==============================================================================
# Manifest: deployment.yaml
# Namespace: ai-gateway
# Description: GitLab Duo AI Gateway FIPS deployment connecting GitLab to vLLM
#              Semantic Router Hub and enforcing Duo Workflow RSA authentication.
# ==============================================================================

apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-gateway-deployment
  namespace: ai-gateway
  labels:
    app.kubernetes.io/name: ai-gateway
    app.kubernetes.io/part-of: gitlab-duo
    app.kubernetes.io/component: inference-gateway
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: ai-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ai-gateway
    spec:
      containers:
        - name: ai-gateway
          image: registry.gitlab.com/gitlab-org/modelgateway/modelgateway:v18.0.0-fips
          imagePullPolicy: IfNotPresent
          ports:
            - name: http-aigw
              containerPort: 5052
              protocol: TCP
          env:
            - name: AIGW_FASTAPI__ENV
              value: "production"
            - name: AIGW_LOGGING__LEVEL
              value: "INFO"
            - name: AIGW_GITLAB_URL
              value: "https://gitlab.internal.local"
            - name: AIGW_CUSTOM_MODELS__ENABLED
              value: "true"
            - name: AIGW_CUSTOM_MODELS__ENDPOINT
              value: "http://vllm-router.inference.svc.cluster.local:8000/v1"
            - name: AIGW_CUSTOM_MODELS__API_KEY
              value: "vllm-internal-airgap-token"
            - name: AIGW_CODE_COMPLETIONS__MODEL
              value: "nemotron-3.5-lightning"
            - name: AIGW_CODE_GENERATIONS__MODEL
              value: "gpt-oss-120b"
            - name: AIGW_AGENTIC_WORKFLOWS__MODEL
              value: "gpt-oss-120b"
            - name: AIGW_DUO_WORKFLOW__ENABLED
              value: "true"
            - name: DUO_WORKFLOW_SELF_SIGNED_JWT__SIGNING_KEY
              valueFrom:
                secretKeyRef:
                  name: ai-gateway-duo-workflow-jwt-validation-key
                  key: signing_key.pem
                  optional: true
            - name: DUO_WORKFLOW_SELF_SIGNED_JWT__VALIDATION_KEY
              valueFrom:
                secretKeyRef:
                  name: ai-gateway-duo-workflow-jwt-validation-key
                  key: validation_key.pem
                  optional: true
          resources:
            requests:
              cpu: 1000m
              memory: 2Gi
            limits:
              cpu: 4000m
              memory: 4Gi
          livenessProbe:
            httpGet:
              path: /monitoring/healthz
              port: 5052
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /monitoring/ready
              port: 5052
            initialDelaySeconds: 10
            periodSeconds: 5

---
apiVersion: v1
kind: Service
metadata:
  name: ai-gateway
  namespace: ai-gateway
  labels:
    app.kubernetes.io/name: ai-gateway
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 5052
      targetPort: 5052
      protocol: TCP
  selector:
    app.kubernetes.io/name: ai-gateway
