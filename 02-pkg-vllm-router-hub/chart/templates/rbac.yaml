apiVersion: v1
kind: ServiceAccount
metadata:
  name: vllm-router-sa
  namespace: {{ .Release.Namespace | default .Values.namespace | default "inference" }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: service-reader
  namespace: {{ .Release.Namespace | default .Values.namespace | default "inference" }}
rules:
- apiGroups: [""]
  resources: ["services"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: vllm-router-sa-binding
  namespace: {{ .Release.Namespace | default .Values.namespace | default "inference" }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: service-reader
subjects:
- kind: ServiceAccount
  name: vllm-router-sa
  namespace: {{ .Release.Namespace | default .Values.namespace | default "inference" }}